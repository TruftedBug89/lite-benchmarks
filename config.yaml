# Lite Benchmarks Configuration
# API keys are read from environment variables by litellm automatically:
#   DEEPSEEK_API_KEY, GROQ_API_KEY, GEMINI_API_KEY (or GOOGLE_API_KEY), OPENAI_API_KEY, ANTHROPIC_API_KEY
#   LM Studio needs no key — just a running server at localhost:1234

# litellm model IDs: "provider/model-name"
# thinking_effort can be: max, high, xhigh, ultracode, medium, low
# max_tokens can be specified per model for high-reasoning models (e.g. max_tokens: 16384)
models:
  - id: anthropic/claude-3-7-sonnet-20250219
    name: Claude 3.7 Sonnet (Max Thinking)
    thinking_effort: max
    max_tokens: 16384
  - id: openai/o3-mini
    name: o3-mini (High Thinking)
    thinking_effort: high
    max_tokens: 16384
  - id: gemini/gemini-2.5-pro
    name: Gemini 2.5 Pro (Max Thinking)
    thinking_effort: max
    max_tokens: 16384
  - id: gemini/gemini-2.5-flash
    name: Gemini 2.5 Flash (Max Thinking)
    thinking_effort: max
    max_tokens: 16384
  - id: deepseek/deepseek-reasoner
    name: DeepSeek R1 (Max Thinking)
    thinking_effort: max
    max_tokens: 16384
  - id: deepseek/deepseek-chat
    name: DeepSeek V3
  - id: groq/llama-3.3-70b-versatile
    name: Llama 3.3 70B (High Thinking)
    thinking_effort: high
  # Local LM Studio examples (start the local server first, default port 1234):
  # - id: lm_studio/qwen2.5-coder-7b-instruct
  #   name: Qwen 2.5 Coder 7B (local)

# Categories group benchmarks for the leaderboard.
# Category score = average of its benchmark scores.
# Overall score  = average of all category scores.
categories:
  coding:
    benchmarks: [bigcodebench_hard, humanevalplus, mbppplus, scicode]
  science:
    benchmarks: [gpqa, scibench]
  math:
    benchmarks: [aime, math_500]
  knowledge:
    benchmarks: [mmlu_pro, supergpqa]
  instruction:
    benchmarks: [ifeval, tau_bench]

# Optional `revision` parameter pins exact HuggingFace git commit SHAs for reproducibility.
benchmarks:
  bigcodebench_hard:
    enabled: true
    dataset: bigcode/bigcodebench-hard
    split: v0.1.4
    num_samples: 50
  humanevalplus:
    enabled: true
    dataset: evalplus/humanevalplus
    split: test
    num_samples: 50
    # revision: "e1f2a3b..."
  mbppplus:
    enabled: true
    dataset: evalplus/mbppplus
    split: test
    num_samples: 50
  gpqa:
    enabled: true
    dataset: nichenshun/gpqa_diamond
    split: train
    num_samples: 50
  scibench:
    enabled: true
    dataset: xw27/scibench
    split: train
    num_samples: 50
  aime:
    enabled: true
    dataset: AI-MO/aimo-validation-aime
    split: train
    num_samples: 50
  math_500:
    enabled: true
    dataset: HuggingFaceH4/MATH-500
    split: test
    num_samples: 50
  mmlu_pro:
    enabled: true
    dataset: TIGER-Lab/MMLU-Pro
    split: test
    num_samples: 50
  ifeval:
    enabled: true
    dataset: google/IFEval
    split: train
    num_samples: 50
  scicode:
    enabled: true
    dataset: SciCode1/SciCode
    split: test
    num_samples: 50
  supergpqa:
    enabled: true
    dataset: m-a-p/SuperGPQA
    split: train
    num_samples: 50
  tau_bench:
    enabled: true
    dataset: amityco/tau-bench-retail-train-next-action
    split: train
    num_samples: 50

settings:
  seed: 42
  max_tokens: 4096
  temperature: 0.0
  request_timeout: 300
  code_exec_timeout: 30
  # Attempts per question on transient provider errors (timeouts, 429, 5xx).
  # 0 = wait for a good response indefinitely (until Force Stop); a positive
  # number caps attempts. Permanent errors (context length, content filter)
  # are never retried — they can never succeed.
  max_retries: 0
  max_concurrency: 5
  # How many models run in parallel (each does its benchmarks one at a time);
  # extra models queue.
  max_concurrent_models: 4
  results_dir: results
  charts_dir: charts
  # HuggingFace token for gated datasets (e.g. cais/hle).
  # Set HF_TOKEN env var or leave empty for public-only datasets.
  hf_token_env: HF_TOKEN
