# Lite Benchmarks Configuration
# API keys are read from environment variables by litellm automatically:
#   DEEPSEEK_API_KEY, GROQ_API_KEY, GEMINI_API_KEY (or GOOGLE_API_KEY), OPENAI_API_KEY, ANTHROPIC_API_KEY
#   Ollama needs no key — just a running server at localhost:11434

# litellm model IDs: "provider/model-name"
# thinking_effort can be: max, high, xhigh, ultracode, medium, low
models:
  - id: anthropic/claude-3-7-sonnet-20250219
    name: Claude 3.7 Sonnet (Max Thinking)
    thinking_effort: max
  - id: openai/o3-mini
    name: o3-mini (High Thinking)
    thinking_effort: high
  - id: gemini/gemini-2.5-pro
    name: Gemini 2.5 Pro (Max Thinking)
    thinking_effort: max
  - id: gemini/gemini-2.5-flash
    name: Gemini 2.5 Flash (Max Thinking)
    thinking_effort: max
  - id: deepseek/deepseek-reasoner
    name: DeepSeek R1 (Max Thinking)
    thinking_effort: max
  - id: deepseek/deepseek-chat
    name: DeepSeek V3
  - id: groq/llama-3.3-70b-versatile
    name: Llama 3.3 70B (High Thinking)
    thinking_effort: high
  # Local LM Studio examples (start the local server first, default port 1234):
  # - id: lm_studio/qwen2.5-coder-7b-instruct
  #   name: Qwen 2.5 Coder 7B (local)

# Categories group benchmarks for the leaderboard.
# Category score = average of its benchmark scores.
# Overall score  = average of all category scores.
categories:
  coding:
    benchmarks: [bigcodebench_hard, humanevalplus, mbppplus, scicode]
  science:
    benchmarks: [gpqa, scibench]
  math:
    benchmarks: [aime, math_500]
  knowledge:
    benchmarks: [mmlu_pro, hle]
  instruction:
    benchmarks: [ifeval, tau_bench]

benchmarks:
  bigcodebench_hard:
    enabled: true
    dataset: bigcode/bigcodebench-hard
    split: v0.1.4
    num_samples: 50
  humanevalplus:
    enabled: true
    dataset: evalplus/humanevalplus
    split: test
    num_samples: 50
  mbppplus:
    enabled: true
    dataset: evalplus/mbppplus
    split: test
    num_samples: 50
  gpqa:
    enabled: true
    dataset: nichenshun/gpqa_diamond
    split: train
    num_samples: 50
  scibench:
    enabled: true
    dataset: xw27/scibench
    split: train
    num_samples: 50
  aime:
    enabled: true
    dataset: AI-MO/aimo-validation-aime
    split: train
    num_samples: 50
  math_500:
    enabled: true
    dataset: HuggingFaceH4/MATH-500
    split: test
    num_samples: 50
  mmlu_pro:
    enabled: true
    dataset: TIGER-Lab/MMLU-Pro
    split: test
    num_samples: 50
  ifeval:
    enabled: true
    dataset: google/IFEval
    split: train
    num_samples: 50
  scicode:
    enabled: true
    dataset: SciCode1/SciCode
    split: test
    num_samples: 50
  hle:
    enabled: true
    dataset: cais/hle
    split: test
    num_samples: 50
  tau_bench:
    enabled: true
    dataset: amityco/tau-bench-retail-train-next-action
    split: train
    num_samples: 50

settings:
  seed: 42
  max_tokens: 4096
  temperature: 0.0
  request_timeout: 300
  code_exec_timeout: 30
  max_retries: 3
  max_concurrency: 5
  results_dir: results
  charts_dir: charts
  # HuggingFace token for gated datasets.
  # Set HF_TOKEN env var or leave empty for public-only datasets.
  hf_token_env: HF_TOKEN

