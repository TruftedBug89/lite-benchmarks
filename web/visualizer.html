<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Response & Judge Visualizer — Lite Benchmarks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #090d16;
      --bg-card: rgba(21, 30, 48, 0.7);
      --bg-card-hover: rgba(30, 43, 69, 0.9);
      --border-color: rgba(255, 255, 255, 0.08);
      --border-glow: rgba(99, 102, 241, 0.35);
      --accent-primary: #6366f1;
      --accent-cyan: #06b6d4;
      --accent-green: #10b981;
      --accent-amber: #f59e0b;
      --accent-rose: #f43f5e;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-dark);
      background-image:
        radial-gradient(at 10% 10%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
        radial-gradient(at 90% 20%, rgba(6, 182, 212, 0.12) 0px, transparent 50%),
        radial-gradient(at 50% 90%, rgba(16, 185, 129, 0.1) 0px, transparent 50%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-color);
      padding: 0.85rem 1.5rem;
      display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    }
    .brand { display: flex; align-items: center; gap: 0.75rem; text-decoration: none; color: inherit; }
    .brand-icon {
      width: 38px; height: 38px;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-cyan));
      border-radius: 10px; display: flex; align-items: center; justify-content: center;
      font-size: 1.25rem; box-shadow: 0 0 15px rgba(99, 102, 241, 0.4);
    }
    .brand-title {
      font-family: 'Outfit', sans-serif; font-size: 1.25rem; font-weight: 800;
      background: linear-gradient(90deg, #ffffff, #cbd5e1);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .controls-bar {
      display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap;
    }
    .select-input, .search-input {
      background: rgba(15, 23, 42, 0.9); border: 1px solid var(--border-color);
      border-radius: 8px; padding: 0.45rem 0.75rem; color: var(--text-main);
      font-family: inherit; font-size: 0.82rem; outline: none; transition: all 0.2s;
    }
    .select-input:focus, .search-input:focus {
      border-color: var(--accent-primary); box-shadow: 0 0 10px rgba(99, 102, 241, 0.3);
    }
    .filter-pills { display: flex; gap: 0.35rem; }
    .pill {
      padding: 0.35rem 0.7rem; border-radius: 20px; font-size: 0.75rem; font-weight: 600;
      background: rgba(255,255,255,0.05); border: 1px solid var(--border-color);
      color: var(--text-muted); cursor: pointer; transition: all 0.2s;
    }
    .pill:hover { background: rgba(255,255,255,0.1); color: var(--text-main); }
    .pill.active {
      background: rgba(99, 102, 241, 0.2); border-color: var(--accent-primary);
      color: var(--accent-primary); box-shadow: 0 0 10px rgba(99, 102, 241, 0.25);
    }
    .btn {
      padding: 0.45rem 0.9rem; border-radius: 8px;
      font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 0.82rem;
      border: none; cursor: pointer; display: inline-flex; align-items: center; gap: 0.4rem;
      transition: all 0.2s; text-decoration: none;
    }
    .btn-secondary { background: rgba(255,255,255,0.06); color: var(--text-main); border: 1px solid var(--border-color); }
    .btn-secondary:hover { background: rgba(255,255,255,0.12); }
    .btn-primary { background: linear-gradient(135deg, var(--accent-primary), var(--accent-cyan)); color: white; }

    .visualizer-container {
      display: grid; grid-template-columns: 340px 1fr; flex: 1; overflow: hidden; height: calc(100vh - 60px);
    }
    .sidebar {
      background: rgba(15, 23, 42, 0.7); border-right: 1px solid var(--border-color);
      display: flex; flex-direction: column; overflow-y: auto;
    }
    .sidebar-header {
      padding: 0.75rem 1rem; border-bottom: 1px solid var(--border-color);
      font-size: 0.8rem; font-weight: 700; color: var(--text-muted);
      display: flex; align-items: center; justify-content: space-between;
    }
    .question-list { display: flex; flex-direction: column; }
    .q-item {
      padding: 0.75rem 1rem; border-bottom: 1px solid rgba(255,255,255,0.04);
      cursor: pointer; transition: all 0.15s; display: flex; flex-direction: column; gap: 0.3rem;
    }
    .q-item:hover { background: rgba(255,255,255,0.04); }
    .q-item.active {
      background: rgba(99, 102, 241, 0.15); border-left: 3px solid var(--accent-primary);
    }
    .q-top { display: flex; justify-content: space-between; align-items: center; }
    .q-title { font-weight: 700; font-size: 0.85rem; }
    .q-snippet { font-size: 0.76rem; color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .score-badge {
      font-size: 0.7rem; font-weight: 700; padding: 0.15rem 0.5rem; border-radius: 12px; display: inline-flex; align-items: center; gap: 0.25rem;
    }
    .score-badge.pass { background: rgba(16, 185, 129, 0.18); color: var(--accent-green); border: 1px solid rgba(16, 185, 129, 0.35); }
    .score-badge.fail { background: rgba(244, 63, 94, 0.18); color: var(--accent-rose); border: 1px solid rgba(244, 63, 94, 0.35); }
    .score-badge.eval_error { background: rgba(245, 158, 11, 0.18); color: var(--accent-amber); border: 1px solid rgba(245, 158, 11, 0.35); }

    .main-panel { display: flex; flex-direction: column; overflow-y: auto; padding: 1.25rem; gap: 1rem; }
    .detail-card {
      background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 14px;
      padding: 1.25rem; display: flex; flex-direction: column; gap: 0.85rem; box-shadow: 0 4px 20px rgba(0,0,0,0.25);
    }
    .card-title {
      font-family: 'Outfit', sans-serif; font-size: 0.95rem; font-weight: 700;
      display: flex; align-items: center; justify-content: space-between;
      color: var(--text-main); text-transform: uppercase; letter-spacing: 0.04em;
    }
    .meta-strip {
      display: flex; flex-wrap: wrap; gap: 0.75rem; padding: 0.6rem 0.9rem;
      background: rgba(15, 23, 42, 0.8); border: 1px solid var(--border-color); border-radius: 10px; font-size: 0.78rem;
    }
    .meta-item { display: flex; align-items: center; gap: 0.35rem; }
    .meta-label { color: var(--text-dim); }
    .meta-val { font-weight: 600; color: var(--text-main); font-family: 'JetBrains Mono', monospace; }

    .view-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .view-grid.stacked { grid-template-columns: 1fr; }

    .code-box {
      background: rgba(9, 13, 22, 0.95); border: 1px solid var(--border-color); border-radius: 10px;
      padding: 0.85rem 1rem; font-family: 'JetBrains Mono', monospace; font-size: 0.82rem;
      line-height: 1.5; color: #e2e8f0; white-space: pre-wrap; word-break: break-word;
      max-height: 380px; overflow-y: auto;
    }
    .copy-btn {
      float: right; padding: 0.2rem 0.5rem; font-size: 0.7rem; background: rgba(255,255,255,0.08);
      border: 1px solid var(--border-color); border-radius: 5px; color: var(--text-muted); cursor: pointer;
    }
    .copy-btn:hover { background: rgba(255,255,255,0.15); color: white; }

    .compare-row {
      display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-top: 0.4rem;
    }
    .compare-box {
      padding: 0.65rem 0.85rem; border-radius: 8px; font-family: 'JetBrains Mono', monospace; font-size: 0.8rem;
      display: flex; flex-direction: column; gap: 0.25rem;
    }
    .compare-box.target { background: rgba(16, 185, 129, 0.08); border: 1px solid rgba(16, 185, 129, 0.25); color: #a7f3d0; }
    .compare-box.extracted { background: rgba(6, 182, 212, 0.08); border: 1px solid rgba(6, 182, 212, 0.25); color: #bae6fd; }

    .empty-state { text-align: center; padding: 4rem 2rem; color: var(--text-dim); font-size: 0.95rem; }
  </style>
</head>
<body>

<header>
  <a href="/index.html" class="brand">
    <div class="brand-icon">🎯</div>
    <div>
      <div class="brand-title">AI Response & Judge Visualizer</div>
      <div style="font-size: 0.72rem; color: var(--text-dim);">Lite Benchmarks Evaluation Studio</div>
    </div>
  </a>

  <div class="controls-bar">
    <select class="select-input" id="model-select" onchange="loadQuestions()"><option value="">Loading models...</option></select>
    <select class="select-input" id="bench-select" onchange="filterAndRender()"><option value="">All Benchmarks</option></select>
    <div class="filter-pills">
      <button class="pill active" id="filter-all" onclick="setFilter('all')">All</button>
      <button class="pill" id="filter-pass" onclick="setFilter('pass')">✅ Pass (1.0)</button>
      <button class="pill" id="filter-fail" onclick="setFilter('fail')">❌ Fail (0.0)</button>
      <button class="pill" id="filter-err" onclick="setFilter('err')">⚠️ Scorer Errs</button>
    </div>
    <input type="text" class="search-input" id="search-box" placeholder="Search prompt/response..." oninput="filterAndRender()" style="width:160px;">
    <button class="btn btn-secondary" id="layout-btn" onclick="toggleLayout()">🥞 Stacked View</button>
    <a href="/index.html" class="btn btn-primary">📊 Dashboard</a>
  </div>
</header>

<div class="visualizer-container">
  <div class="sidebar">
    <div class="sidebar-header">
      <span>Evaluated Questions</span>
      <span id="question-count-badge">0 items</span>
    </div>
    <div class="question-list" id="question-list">
      <div class="empty-state">Loading questions...</div>
    </div>
  </div>

  <div class="main-panel" id="main-panel">
    <div class="empty-state">Select a question from the left sidebar to visualize prompt, model response, judge logs, and points gotten.</div>
  </div>
</div>

<script>
  let allQuestions = [];
  let filteredQuestions = [];
  let selectedIndex = 0;
  let currentFilter = 'all';
  let isStacked = false;

  async function init() {
    // Parse URL params
    const params = new URLSearchParams(window.location.search);
    const targetModel = params.get('model');
    const targetBench = params.get('benchmark');
    const targetQ = params.get('q');

    try {
      const res = await fetch('/api/results');
      const data = await res.json();
      const models = Object.keys(data.models || {});

      const sel = document.getElementById('model-select');
      if (models.length === 0) {
        sel.innerHTML = '<option value="">No completed models found</option>';
        return;
      }

      sel.innerHTML = models.map(m => `<option value="${m}">${m}</option>`).join('');
      if (targetModel && models.includes(targetModel)) {
        sel.value = targetModel;
      }

      await loadQuestions();

      if (targetBench) {
        document.getElementById('bench-select').value = targetBench;
        filterAndRender();
      }
      if (targetQ != null) {
        const idx = parseInt(targetQ, 10);
        const match = filteredQuestions.findIndex(q => q.index === idx || q.question_id === idx);
        if (match !== -1) selectQuestion(match);
      }
    } catch (e) {
      console.error('Failed to init visualizer:', e);
    }
  }

  async function loadQuestions() {
    const model = document.getElementById('model-select').value;
    if (!model) return;

    try {
      const res = await fetch(`/api/model-questions?model=${encodeURIComponent(model)}`);
      const data = await res.json();
      allQuestions = data.questions || [];

      // Extract unique benchmarks
      const benches = Array.from(new Set(allQuestions.map(q => q.benchmark).filter(Boolean)));
      const benchSel = document.getElementById('bench-select');
      benchSel.innerHTML = '<option value="">All Benchmarks</option>' + benches.map(b => `<option value="${b}">${b}</option>`).join('');

      filterAndRender();
    } catch (e) {
      document.getElementById('question-list').innerHTML = `<div class="empty-state" style="color:var(--accent-rose)">Failed to load question details: ${e}</div>`;
    }
  }

  function setFilter(filter) {
    currentFilter = filter;
    document.querySelectorAll('.filter-pills .pill').forEach(p => p.classList.remove('active'));
    document.getElementById(`filter-${filter}`).classList.add('active');
    filterAndRender();
  }

  function filterAndRender() {
    const bench = document.getElementById('bench-select').value;
    const query = document.getElementById('search-box').value.toLowerCase().trim();

    filteredQuestions = allQuestions.filter(q => {
      if (bench && q.benchmark !== bench) return false;
      if (currentFilter === 'pass' && q.score < 1.0) return false;
      if (currentFilter === 'fail' && (q.score >= 1.0 || q.status === 'eval_error')) return false;
      if (currentFilter === 'err' && q.status !== 'eval_error') return false;
      if (query) {
        const text = ((q.prompt || '') + ' ' + (q.response_text || '') + ' ' + (q.judge_response || '')).toLowerCase();
        if (!text.includes(query)) return false;
      }
      return true;
    });

    document.getElementById('question-count-badge').textContent = `${filteredQuestions.length} items`;
    renderSidebar();

    if (filteredQuestions.length > 0) {
      selectQuestion(0);
    } else {
      document.getElementById('main-panel').innerHTML = '<div class="empty-state">No matching evaluated questions found for current filters.</div>';
    }
  }

  function renderSidebar() {
    const list = document.getElementById('question-list');
    if (filteredQuestions.length === 0) {
      list.innerHTML = '<div class="empty-state" style="padding:2rem 1rem">No questions</div>';
      return;
    }

    list.innerHTML = filteredQuestions.map((q, idx) => {
      const isPass = q.score >= 1.0;
      let badgeClass = isPass ? 'pass' : 'fail';
      let badgeText = isPass ? `1.0 PASS` : `${q.score} FAIL`;
      if (q.status === 'eval_error') { badgeClass = 'eval_error'; badgeText = '0.0 ERR'; }

      const activeClass = idx === selectedIndex ? 'active' : '';
      return `
        <div class="q-item ${activeClass}" onclick="selectQuestion(${idx})">
          <div class="q-top">
            <span class="q-title">Q#${q.index != null ? q.index : q.question_id} ${q.benchmark ? '[' + escapeHtml(q.benchmark) + ']' : ''}</span>
            <span class="score-badge ${badgeClass}">${badgeText}</span>
          </div>
          <div class="q-snippet">${escapeHtml(q.prompt || 'No prompt text')}</div>
        </div>`;
    }).join('');
  }

  function selectQuestion(idx) {
    selectedIndex = idx;
    renderSidebar();

    const q = filteredQuestions[idx];
    if (!q) return;

    const main = document.getElementById('main-panel');
    const isPass = q.score >= 1.0;
    const scoreColor = isPass ? 'var(--accent-green)' : (q.status === 'eval_error' ? 'var(--accent-amber)' : 'var(--accent-rose)');
    const pointsBadge = `<span class="score-badge ${isPass ? 'pass' : 'fail'}" style="font-size:0.88rem; padding:0.35rem 0.85rem; border-radius:10px;">🌟 Points Earned: ${q.score} / 1.0</span>`;

    main.innerHTML = `
      <div class="detail-card">
        <div class="card-title">
          <span>🎯 Question #${q.index != null ? q.index : q.question_id} ${q.benchmark ? '— ' + escapeHtml(q.benchmark) : ''}</span>
          ${pointsBadge}
        </div>
        <div class="meta-strip">
          <div class="meta-item"><span class="meta-label">Status:</span> <span class="meta-val" style="color:${scoreColor}">${q.status}</span></div>
          <div class="meta-item"><span class="meta-label">Tokens:</span> <span class="meta-val">${(q.total_tokens || 0).toLocaleString()} (in:${q.input_tokens || 0}, out:${q.output_tokens || 0})</span></div>
          <div class="meta-item"><span class="meta-label">Speed:</span> <span class="meta-val">${q.tps ? q.tps + ' tps' : '—'}</span></div>
          <div class="meta-item"><span class="meta-label">Time:</span> <span class="meta-val">${q.time_ms ? q.time_ms.toFixed(0) + ' ms' : '—'}</span></div>
          ${q.cost_usd ? `<div class="meta-item"><span class="meta-label">Cost:</span> <span class="meta-val">$${q.cost_usd.toFixed(6)}</span></div>` : ''}
          ${q.is_truncated ? `<div class="meta-item"><span class="meta-val" style="color:#a855f7">✂️ Truncated (${q.finish_reason || 'length'})</span></div>` : ''}
        </div>
      </div>

      <div class="view-grid ${isStacked ? 'stacked' : ''}">
        <div class="detail-card">
          <div class="card-title">
            <span>📝 Prompt & Problem Statement</span>
            <button class="copy-btn" onclick="copyText('prompt-code')">Copy</button>
          </div>
          <div class="code-box" id="prompt-code">${escapeHtml(q.prompt || 'No prompt recorded')}</div>
        </div>

        <div class="detail-card">
          <div class="card-title">
            <span>🤖 AI Model Response</span>
            <button class="copy-btn" onclick="copyText('response-code')">Copy</button>
          </div>
          <div class="code-box" id="response-code" style="border-color:${isPass ? 'rgba(16, 185, 129, 0.3)' : 'rgba(244, 63, 94, 0.3)'}">${escapeHtml(q.response_text || q.response || 'No response recorded')}</div>
        </div>
      </div>

      <div class="detail-card">
        <div class="card-title">
          <span>⚖️ Judge Response & Deterministic Verification Output</span>
        </div>
        <div class="compare-row">
          <div class="compare-box target">
            <span style="font-weight:700; color:var(--accent-green); font-size:0.75rem; text-transform:uppercase;">🎯 Expected Target Answer / Test Suite:</span>
            <div>${escapeHtml(q.expected_answer || 'N/A (Re-run benchmark to capture target)')}</div>
          </div>
          <div class="compare-box extracted">
            <span style="font-weight:700; color:var(--accent-cyan); font-size:0.75rem; text-transform:uppercase;">🔍 Extracted Answer from Response:</span>
            <div>${escapeHtml(q.extracted_answer || 'N/A')}</div>
          </div>
        </div>
        <div class="code-box" style="margin-top:0.6rem; color:#cbd5e1; background:rgba(15,23,42,0.9); border:1px solid var(--border-glow);">
          <strong>Judge Output / Log:</strong>\n${escapeHtml(q.judge_response || `Evaluated using built-in verifier. Resulting score: ${q.score}`)}
          ${q.error_msg ? `\n\n❌ Error Details: ${escapeHtml(q.error_msg)}` : ''}
        </div>
      </div>
    `;
  }

  function toggleLayout() {
    isStacked = !isStacked;
    const btn = document.getElementById('layout-btn');
    btn.textContent = isStacked ? '🥞 Side-by-Side View' : '🥞 Stacked View';
    if (filteredQuestions.length > 0) selectQuestion(selectedIndex);
  }

  function copyText(elemId) {
    const text = document.getElementById(elemId).textContent;
    navigator.clipboard.writeText(text);
  }

  function escapeHtml(str) {
    return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  window.onload = init;
</script>

</body>
</html>
